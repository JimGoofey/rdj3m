<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RDJ3M VIP – Link</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6f0ec; --ink:#12332b; --muted:#4d6b62; --card:#fffdf7; --edge:#12332b; --shadow:#12332b; --accent:#ffb84d; --avatar:#ffb84d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1f1b; --ink:#e8f3ee; --muted:#93b0a5; --card:#1a302a; --edge:#e8f3ee; --shadow:#ffb84d; --accent:#ffb84d; --avatar:#ffb84d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1f1b; --ink:#e8f3ee; --muted:#93b0a5; --card:#1a302a; --edge:#e8f3ee; --shadow:#ffb84d; --accent:#ffb84d; --avatar:#ffb84d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex; justify-content:center; padding:48px 20px 40px;
}
main{width:100%; max-width:420px; text-align:center}
.avatar{
  width:96px; height:96px; border-radius:50%; margin:0 auto 18px;
  background:var(--avatar); border:3px solid var(--edge);
  display:grid; place-items:center; font-weight:800; font-size:38px; color:#12332b;
  object-fit:cover;
}
h1{font-size:30px; font-weight:800; margin:0 0 6px; letter-spacing:-0.02em}
.bio{margin:0 0 32px; color:var(--muted); font-size:16px; line-height:1.5}
ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:16px}
a.link{
  display:block; padding:16px 20px; border-radius:999px;
  background:var(--card); color:var(--ink); text-decoration:none;
  font-weight:700; font-size:17px;
  border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow);
  transition:transform .12s, box-shadow .12s;
}
a.link:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--shadow)}
a.link:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--shadow)}
a.link:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
a.main{background:var(--accent); color:#12332b}
footer{margin-top:40px; font-size:13px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.link{transition:none}}
</style>
</head>
<body>
<main>
  <img class="avatar" src="HKD.jpg" alt="avatar">
  <h1>RDJ3M VIP</h1>
  <p class="bio">Bahan Pasti Mantep</p>
  <ul>
    <li><a class="link main" href="https://t.me/RDJ3MJunction_bot">RDJ3M Junction</a></li>
  </ul>
  <footer>© 2026 RDJ3M VIP</footer>
</main>
<script data-goatcounter="https://kesatriantu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
